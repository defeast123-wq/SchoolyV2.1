<!DOCTYPE html>
<html>
<head>
<base href="https://cdn.jsdelivr.net/gh/Stinkalistic/junk@main/bioevil4/">
<meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>Bio Evil 4</title>
<link rel="manifest" href="appmanifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,minimal-ui">
<style>*{padding:0;margin:0}html,body{background:#000;color:#fff;overflow:hidden;touch-action:none}canvas{touch-action:none}</style>
</head>
<body>
<div id="fb-root"></div>
<div id="c2canvasdiv"><canvas id="c2canvas" width="256" height="240"><h1>Your browser does not appear to support HTML5.</h1></canvas></div>
<script src="jquery-2.1.1.min.js"></script>
<script src="c2runtime.js"></script>
<script>
window.C2_RegisterSW=function(){
  if(!navigator.serviceWorker)return;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('SW:',e);});
};
function onVisibilityChanged(){
  if(typeof cr_setSuspended!=='function')return;
  cr_setSuspended(document.hidden||document.mozHidden||document.webkitHidden||document.msHidden);
}
document.addEventListener('visibilitychange',onVisibilityChanged,false);
document.addEventListener('mozvisibilitychange',onVisibilityChanged,false);
document.addEventListener('webkitvisibilitychange',onVisibilityChanged,false);
document.addEventListener('msvisibilitychange',onVisibilityChanged,false);
window.addEventListener('load',function(){
  if(typeof cr_createRuntime==='function') cr_createRuntime('c2canvas');
  else console.error('Construct 2 runtime failed to load');
});
</script>
</body>
</html>
