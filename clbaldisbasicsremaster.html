<!doctype html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/web-port@main/baldi-remaster/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Baldi's Basics Classic Remastered</title>
  <style>html,body{margin:0;padding:0;border:0;height:100%;width:100%;overflow:hidden;background:#231f20}#unity-canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<div id="loading-text" style="color:white;font-size:48px;font-family:cursive;text-align:center;margin-top:20px">LOADING...</div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<script src="Build/WebGL.loader.js"></script>
<script>
if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){var meta=document.createElement('meta');meta.name='viewport';meta.content='width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes';document.head.appendChild(meta)}
const loadingText=document.querySelector('#loading-text');let totalBytes=0,loadedBytes=0;
function formatSize(bytes){if(bytes>1024**3)return(bytes/1024**3).toFixed(2)+' GB';if(bytes>1024**2)return(bytes/1024**2).toFixed(2)+' MB';if(bytes>1024)return(bytes/1024).toFixed(2)+' KB';return bytes+' B'}
async function getSize(url){try{const res=await fetch(url,{method:'HEAD'});return parseInt(res.headers.get('Content-Length')||'0',10)}catch{return 0}}
async function fetchWithProgress(url){const response=await fetch(url),reader=response.body.getReader();let chunks=[],received=0;while(true){const {done,value}=await reader.read();if(done)break;received+=value.length;loadedBytes+=value.length;chunks.push(value);loadingText.textContent=`LOADING... ${formatSize(loadedBytes)} / ${formatSize(totalBytes)} (${totalBytes>0?((loadedBytes/totalBytes)*100).toFixed(1):'?'}%)`}let fullBuffer=new Uint8Array(received),offset=0;for(const chunk of chunks){fullBuffer.set(chunk,offset);offset+=chunk.length}return fullBuffer.buffer}
function getParts(file,count){let parts=[];for(let i=1;i<=count;i++)parts.push(file+'.part'+i);return parts}
async function mergeFiles(parts){return URL.createObjectURL(new Blob(await Promise.all(parts.map(fetchWithProgress))))}
(async()=>{const dataParts=getParts('Build/WebGL.data',3),wasmParts=getParts('Build/WebGL.wasm',3),allParts=[...dataParts,...wasmParts],sizes=await Promise.all(allParts.map(getSize));totalBytes=sizes.reduce((a,b)=>a+b,0);const [dataUrl,wasmUrl]=await Promise.all([mergeFiles(dataParts),mergeFiles(wasmParts)]);createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl,frameworkUrl:'Build/WebGL.framework.js',codeUrl:wasmUrl,streamingAssetsUrl:'StreamingAssets',companyName:'Basically Games',productName:"Baldi's Basics Classic Remastered",productVersion:'1.1'}).then(()=>loadingText.remove())})().catch(e=>alert('Failed to load game: '+e.message));
</script></body></html>
