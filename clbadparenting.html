<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/bad-parenting/">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Bad Parenting 1</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}#unity-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}#unity-canvas{width:100%;height:100%;background:#000}#unity-loading-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:50%;height:20px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}#unity-progress-bar-full{height:100%;width:0%;background:#09f;transition:width .2s ease}</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div></div>
<script>
const canvas=document.querySelector('#unity-canvas'),loadingBar=document.querySelector('#unity-loading-bar'),progressBarFull=document.querySelector('#unity-progress-bar-full');
function unityShowBanner(msg,type){}
const buildUrl='Build',loaderUrl=buildUrl+'/Build.loader.js';
async function loadSplitData(baseUrl,parts){const chunks=[];for(let i=1;i<=parts;i++){const r=await fetch(`${baseUrl}.part${i}`);if(!r.ok)throw new Error(`Failed to load ${baseUrl}.part${i}`);chunks.push(await r.arrayBuffer());progressBarFull.style.width=(i/parts)*30+'%';}return URL.createObjectURL(new Blob(chunks));}
const config={dataUrl:buildUrl+'/Build.data',frameworkUrl:buildUrl+'/Build.framework.js',codeUrl:buildUrl+'/Build.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'twoootwo',productName:'Bad Parenting 1',productVersion:'1.0',showBanner:unityShowBanner};
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resizeCanvas);resizeCanvas();loadingBar.style.display='block';
Promise.all([loadSplitData('Build/Build.wasm',2),loadSplitData('Build/Build.data',3)]).then(([wasmUrl,dataUrl])=>{config.codeUrl=wasmUrl;config.dataUrl=dataUrl;const script=document.createElement('script');script.src=loaderUrl;script.onload=()=>{createUnityInstance(canvas,config,progress=>{progressBarFull.style.width=30+70*progress+'%';}).then(unityInstance=>{loadingBar.style.display='none';addEventListener('click',()=>unityInstance.SetFullscreen(1));URL.revokeObjectURL(wasmUrl);URL.revokeObjectURL(dataUrl);}).catch(alert)};document.body.appendChild(script)}).catch(e=>alert('Failed to load game data: '+e.message));
</script></body></html>
